# Reusable workflow: plan (and optionally apply) ONE environment.
# terraform.yml calls it once for dev and once for prod, so both environments
# run identical steps and differ only by inputs.
#
# AWS access: GitHub OIDC -> the EXISTING IAM role GitHub-OIDC (created outside
# this repo; see docs/github-oidc-role.md). No AWS keys are stored in GitHub.
name: terraform-env

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment directory under environments/ (dev or prod)"
        type: string
        required: true
      apply:
        description: "Apply after planning (requires the GitHub Environment gate)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: environments/${{ inputs.environment }}
  AWS_REGION: us-east-1
  # Not a secret. Name is deterministic: foundation-tfstate-<account-id> (see bootstrap/).
  TF_STATE_BUCKET: foundation-tfstate-868713841842

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::868713841842:role/GitHub-OIDC
          aws-region: us-east-1
          role-session-name: gha-plan-${{ inputs.environment }}-${{ github.run_id }}

      - name: Terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -out=tfplan

      - name: Plan summary
        working-directory: ${{ env.WORKDIR }}
        run: |
          {
            echo "### Terraform plan: ${{ inputs.environment }}"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1

  apply:
    name: apply (${{ inputs.environment }})
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    # The GitHub Environment is the approval gate: configure required reviewers
    # on "prod" and this job pauses until they approve. NOTE: jobs that declare
    # an environment send the OIDC subject "...:environment:<name>" (not
    # "...:ref:refs/heads/main"), so the role's trust policy must allow it.
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::868713841842:role/GitHub-OIDC
          aws-region: us-east-1
          role-session-name: gha-apply-${{ inputs.environment }}-${{ github.run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.WORKDIR }}

      - name: Terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # Applies exactly the plan that was reviewed; Terraform refuses it if
      # state changed in between.
      - name: Terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply tfplan
