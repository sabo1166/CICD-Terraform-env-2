name: deploy-terrafrom-task

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_ROLE_ARN: arn:aws:iam::943812324876:role/Gitaction
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_REGION: us-east-1

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            region: us-east-1
          - env: test
            region: eu-west-1
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - run: terraform fmt -check -recursive
      - run: >
          terraform init -input=false
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=${{ matrix.env }}/terraform.tfstate"
          -backend-config="region=${STATE_REGION}"
      - run: terraform validate
      - run: terraform plan -input=false

  apply:
    name: Apply (${{ matrix.env }})
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - env: dev
            region: us-east-1
          - env: test
            region: eu-west-1
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - run: >
          terraform init -input=false
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=${{ matrix.env }}/terraform.tfstate"
          -backend-config="region=${STATE_REGION}"
      - run: terraform apply -auto-approve -input=false
